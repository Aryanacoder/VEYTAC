<svg xmlns="http://www.w3.org/2000/svg" width="272" height="60" viewBox="0 0 272 60" role="img" aria-labelledby="veytac-title">
  <title id="veytac-title">VEYTAC</title>
  <defs>
    <linearGradient id="mark-fill" x1="8" y1="5" x2="53" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFF5FF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#73B9FF" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="v-light" x1="13" y1="15" x2="43" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".58" stop-color="#C7E8FF"/>
      <stop offset="1" stop-color="#74B9FF"/>
    </linearGradient>
    <linearGradient id="trace-light" x1="30" y1="43" x2="51" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5FA9FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <style>
    .trace { stroke-dasharray: 42; stroke-dashoffset: 42; animation: draw 3.6s cubic-bezier(.65,0,.2,1) infinite; }
    .beacon { animation: breathe 2.8s ease-in-out infinite; transform-origin: 43.5px 16px; }
    .orbit { animation: orbit 14s linear infinite; transform-origin: 30px 30px; }
    .word { animation: arrive .8s ease-out both; }
    @keyframes draw { 0%, 10% { stroke-dashoffset: 42; opacity: .3; } 42%, 78% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: -42; opacity: .3; } }
    @keyframes breathe { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes arrive { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .trace, .beacon, .orbit, .word { animation: none; } .trace { stroke-dashoffset: 0; } }
  </style>
  <g>
    <rect x="1" y="1" width="58" height="58" rx="17" fill="url(#mark-fill)" stroke="#D4ECFF" stroke-opacity=".55"/>
    <rect x="5" y="5" width="50" height="50" rx="13" fill="#0A2341" fill-opacity=".72" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle class="orbit" cx="30" cy="30" r="23" fill="none" stroke="#B8DDFF" stroke-opacity=".42" stroke-width="1" stroke-dasharray="3 10 18 110"/>
    <path d="M15 16 29.5 44 44 16" fill="none" stroke="url(#v-light)" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M29.5 44 43.5 16" fill="none" stroke="#A5DDFF" stroke-opacity=".6" stroke-width="8" filter="url(#soft-glow)"/>
    <path class="trace" d="M29.5 44 43.5 16" fill="none" stroke="url(#trace-light)" stroke-width="2" stroke-linecap="round"/>
    <path d="M43 16h7m-7 0v-7" fill="none" stroke="#CBE8FF" stroke-opacity=".56" stroke-width="1.4" stroke-linecap="round"/>
    <circle class="beacon" cx="43.5" cy="16" r="3" fill="#FFFFFF"/>
    <circle cx="29.5" cy="44" r="2.4" fill="#90C9FF"/>
  </g>
  <g class="word" fill="#F5FAFF" font-family="Aptos Display, Segoe UI Variable Display, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="3.1">
    <text x="74" y="39.5">VEYTAC</text>
  </g>
  <path d="M76 48h144" stroke="#9CCFFF" stroke-opacity=".43" stroke-width="1"/>
  <circle cx="226" cy="48" r="2" fill="#A8D8FF"/>
</svg>
